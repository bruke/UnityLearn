<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">Profile 与加载路径</text>

  <rect x="80" y="60" width="280" height="140" rx="12" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="220" y="95" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">Local Group</text>
  <text x="220" y="125" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#333">BuildPath 打进安装包</text>
  <text x="220" y="150" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#333">LoadPath 指向 RuntimePath</text>
  <text x="220" y="175" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#4a6fa5">登录界面、核心 Shader</text>

  <rect x="500" y="60" width="280" height="140" rx="12" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="640" y="95" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="bold" fill="#a05a20">Remote Group</text>
  <text x="640" y="125" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#333">BuildPath 输出到 ServerData</text>
  <text x="640" y="150" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#333">LoadPath 指向 CDN 或 Hosting</text>
  <text x="640" y="175" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#d9833a">关卡、皮肤、活动包</text>

  <rect x="80" y="240" width="700" height="140" rx="12" fill="#f4f8fd" stroke="#9db8dd" stroke-width="2"/>
  <text x="430" y="275" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">建议至少两个 Profile</text>
  <text x="430" y="310" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#333">Dev：本机 Hosting 或内网 IP</text>
  <text x="430" y="340" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#333">Release：https://cdn.example.com/aa/版本/平台</text>
  <text x="430" y="365" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#666">真机调试不要用 127.0.0.1</text>
</svg>
