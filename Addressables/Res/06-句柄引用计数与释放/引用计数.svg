<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
  <defs>
    <marker id="a6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">句柄与引用计数</text>

  <rect x="50" y="70" width="200" height="70" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">第一次 Load</text>
  <text x="150" y="122" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#4a6fa5">计数为 1</text>
  <line x1="250" y1="105" x2="288" y2="105" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#a6)"/>

  <rect x="290" y="70" width="200" height="70" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="390" y="100" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#3a6e31">第二次 Load</text>
  <text x="390" y="122" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#5a9e4f">计数为 2</text>
  <line x1="490" y1="105" x2="528" y2="105" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#a6)"/>

  <rect x="530" y="70" width="130" height="70" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a05a20">Release</text>
  <text x="595" y="122" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#d9833a">计数为 1</text>
  <line x1="660" y1="105" x2="698" y2="105" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#a6)"/>

  <rect x="700" y="70" width="120" height="70" rx="10" fill="#f4e6f7" stroke="#a35fae" stroke-width="2"/>
  <text x="760" y="100" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#7a3d85">Release</text>
  <text x="760" y="122" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#a35fae">计数为 0</text>

  <rect x="50" y="180" width="760" height="80" rx="10" fill="#eef7ea" stroke="#bfe0b6" stroke-width="1.5"/>
  <text x="430" y="215" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">计数归零后才会卸载底层 Bundle</text>
  <text x="430" y="240" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#5a9e4f">不释放句柄就等于内存泄漏</text>

  <rect x="50" y="290" width="760" height="80" rx="10" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="430" y="325" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#8a6d1a">直接 Destroy 实例不会减少引用计数</text>
  <text x="430" y="350" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#8a6d1a">InstantiateAsync 生成的对象必须 ReleaseInstance</text>
</svg>
