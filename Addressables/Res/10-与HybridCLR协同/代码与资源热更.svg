<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">代码热更与资源热更</text>

  <rect x="80" y="60" width="300" height="130" rx="12" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="230" y="100" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">HybridCLR</text>
  <text x="230" y="130" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#333">热更 DLL 与补充元数据</text>
  <text x="230" y="158" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#4a6fa5">负责逻辑代码</text>

  <rect x="480" y="60" width="300" height="130" rx="12" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="630" y="100" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="bold" fill="#3a6e31">Addressables</text>
  <text x="630" y="130" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#333">预制体、场景、配置、DLL 文件</text>
  <text x="630" y="158" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#5a9e4f">负责载体与下载</text>

  <rect x="80" y="230" width="700" height="150" rx="12" fill="#f4f8fd" stroke="#9db8dd" stroke-width="2"/>
  <text x="430" y="270" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">推荐启动顺序</text>
  <text x="430" y="305" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#333">AOT 启动，初始化 Addressables，更新 Catalog</text>
  <text x="430" y="335" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#333">下载热更 DLL，加载程序集，再进入热更逻辑</text>
  <text x="430" y="360" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#666">AOT 大版本升级后，热更 DLL 与资源都要重新产出</text>
</svg>
