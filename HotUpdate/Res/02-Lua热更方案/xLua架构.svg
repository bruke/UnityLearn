<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="arrh2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">xLua 热更架构</text>

  <!-- C# 层 -->
  <rect x="60" y="80" width="320" height="220" rx="12" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="220" y="110" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">C# 层 (Unity)</text>
  <text x="220" y="140" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">LuaEnv (Lua 虚拟机)</text>
  <text x="220" y="164" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">C# 业务代码</text>
  <text x="220" y="188" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">LuaManager 封装</text>
  <text x="220" y="216" text-anchor="middle" font-size="11" font-family="monospace" fill="#2b4a7a">[LuaCallCSharp] 生成绑定</text>
  <text x="220" y="240" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">(静态绑定提升性能)</text>

  <!-- 中间虚拟 -->
  <rect x="420" y="110" width="160" height="80" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="500" y="140" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a05a20">Lua ↔ C# 互调</text>
  <text x="500" y="163" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#d9833a">luaL_Call / 委托 / 接口</text>

  <line x1="380" y1="160" x2="418" y2="160" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arrh2)"/>
  <line x1="418" y1="145" x2="380" y2="145" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arrh2)"/>

  <!-- Lua 层 -->
  <rect x="620" y="80" width="180" height="220" rx="12" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="710" y="110" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">Lua 层</text>
  <text x="710" y="145" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">main.lua</text>
  <text x="710" y="170" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">battle.lua</text>
  <text x="710" y="195" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">ui.lua</text>
  <text x="710" y="220" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">(热更逻辑)</text>

  <line x1="580" y1="160" x2="618" y2="160" stroke="#5a9e4f" stroke-width="3" marker-end="url(#arrh2)"/>
  <line x1="618" y1="145" x2="580" y2="145" stroke="#5a9e4f" stroke-width="3" marker-end="url(#arrh2)"/>

  <!-- Hotfix -->
  <rect x="60" y="330" width="740" height="80" rx="10" fill="#f4e6f7" stroke="#a35fae" stroke-width="2"/>
  <text x="430" y="360" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#7a3d85">Hotfix 补丁模式（xLua 特色）</text>
  <text x="430" y="385" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">xlua.hotfix(CS.MyGame.Calculator, 'Add', function(self,a,b) ... end)</text>
  <text x="430" y="405" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">运行中直接替换 C# 方法实现，无需重启</text>
</svg>
