<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="arrh3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">ILRuntime 原理：解释执行 IL</text>

  <!-- 流程 -->
  <rect x="40" y="80" width="190" height="80" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="135" y="112" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">C# 热更源码</text>
  <text x="135" y="134" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#4a6fa5">HotFixProject</text>
  <line x1="230" y1="120" x2="258" y2="120" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arrh3)"/>

  <rect x="260" y="80" width="190" height="80" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="355" y="112" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#3a6e31">编译 DLL (IL)</text>
  <text x="355" y="134" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#5a9e4f">包含中间指令</text>
  <line x1="450" y1="120" x2="478" y2="120" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arrh3)"/>

  <rect x="480" y="80" width="190" height="80" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="575" y="112" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#a05a20">AppDomain 加载</text>
  <text x="575" y="134" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#d9833a">LoadAssembly</text>
  <line x1="670" y1="120" x2="698" y2="120" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arrh3)"/>

  <rect x="700" y="80" width="150" height="80" rx="10" fill="#f4e6f7" stroke="#a35fae" stroke-width="2"/>
  <text x="775" y="112" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#7a3d85">解释执行</text>
  <text x="775" y="134" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#a35fae">逐条跑 IL</text>

  <!-- 说明 -->
  <rect x="40" y="190" width="810" height="110" rx="10" fill="#f7f7f7" stroke="#ddd" stroke-width="1.5"/>
  <text x="445" y="220" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#333">关键机制</text>
  <text x="70" y="250" font-size="12" font-family="sans-serif" fill="#333">① 纯 C# 实现解释器，iOS 无需 JIT 权限</text>
  <text x="70" y="272" font-size="12" font-family="sans-serif" fill="#333">② 跨域调用：热更层调用 AOT 需注册 CLR 绑定（生成代码）</text>
  <text x="70" y="294" font-size="12" font-family="sans-serif" fill="#333">③ 值类型(Vector3) 需 RegisterValueTypeBinder</text>

  <!-- 优缺点 -->
  <rect x="40" y="320" width="390" height="90" rx="10" fill="#eef7ea" stroke="#bfe0b6" stroke-width="1.5"/>
  <text x="235" y="348" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#3a6e31">优点</text>
  <text x="235" y="372" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">纯 C# 语言 · VS 可断点调试热更代码</text>
  <text x="235" y="394" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">C# 生态完整（LINQ/泛型/async）</text>

  <rect x="450" y="320" width="400" height="90" rx="10" fill="#fdf4ec" stroke="#f0c8a5" stroke-width="1.5"/>
  <text x="650" y="348" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a05a20">缺点</text>
  <text x="650" y="372" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">解释执行性能低于原生</text>
  <text x="650" y="394" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">跨域调用频繁则开销大（用 CLR 绑定优化）</text>
</svg>
