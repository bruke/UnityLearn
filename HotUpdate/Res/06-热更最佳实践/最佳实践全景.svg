<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <marker id="arrh6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">热更最佳实践全景</text>

  <!-- 分层架构 -->
  <rect x="40" y="60" width="380" height="230" rx="12" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="230" y="90" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">分层架构</text>

  <rect x="60" y="108" width="340" height="40" rx="8" fill="#eef7ea" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="230" y="133" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#3a6e31">热更业务层（逻辑/UI/战斗/活动）</text>
  <line x1="230" y1="148" x2="230" y2="156" stroke="#555" stroke-width="2" marker-end="url(#arrh6)"/>
  <rect x="60" y="158" width="340" height="40" rx="8" fill="#fdf4ec" stroke="#d9833a" stroke-width="1.5"/>
  <text x="230" y="183" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#a05a20">适配层（Interface + Adapter）</text>
  <line x1="230" y1="198" x2="230" y2="206" stroke="#555" stroke-width="2" marker-end="url(#arrh6)"/>
  <rect x="60" y="208" width="340" height="40" rx="8" fill="#f4f8fd" stroke="#9db8dd" stroke-width="1.5"/>
  <text x="230" y="233" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">基础框架层（引擎/网络/资源/数据）</text>
  <line x1="230" y1="248" x2="230" y2="256" stroke="#555" stroke-width="2" marker-end="url(#arrh6)"/>
  <rect x="60" y="258" width="340" height="24" rx="8" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
  <text x="230" y="275" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">Unity 引擎层</text>

  <!-- 三支柱 -->
  <rect x="440" y="60" width="380" height="110" rx="12" fill="#fdf4ec" stroke="#d9833a" stroke-width="2"/>
  <text x="630" y="90" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#a05a20">安全</text>
  <text x="630" y="120" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">脚本加密 (AES) · 资源签名 (SHA)</text>
  <text x="630" y="145" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">HTTPS 通信 · 防重放 Token</text>

  <rect x="440" y="180" width="380" height="110" rx="12" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="630" y="210" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">性能</text>
  <text x="630" y="240" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">并发下载上限 · LZ4 压缩</text>
  <text x="630" y="265" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">流式解压 · 分帧加载控峰值</text>

  <rect x="440" y="300" width="380" height="110" rx="12" fill="#f4e6f7" stroke="#a35fae" stroke-width="2"/>
  <text x="630" y="330" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#7a3d85">容错与运维</text>
  <text x="630" y="360" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">下载重试 · 断点续传 · 降级</text>
  <text x="630" y="385" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">灰度发布 · 版本回滚 · 埋点监控</text>

  <!-- 底部测试 -->
  <rect x="40" y="410" width="780" height="40" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="430" y="436" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#8a6d1a">上线前必测：断网/弱网/下载中断/CRC失败/磁盘写满/多版本兼容/灰度开关</text>
