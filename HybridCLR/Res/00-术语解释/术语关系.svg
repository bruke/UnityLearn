<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="arrht" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">HybridCLR 核心术语关系</text>

  <!-- 顶部来源 -->
  <rect x="270" y="70" width="320" height="50" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="430" y="95" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">C# 源码</text>

  <line x1="430" y1="120" x2="430" y2="148" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#arrht)"/>
  <text x="470" y="140" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">编译 (Roslyn)</text>

  <!-- IL 分支 -->
  <rect x="300" y="150" width="260" height="50" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="430" y="175" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#3a6e31">IL (中间语言 · DLL)</text>

  <line x1="370" y1="200" x2="250" y2="228" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#arrht)"/>
  <line x1="500" y1="200" x2="600" y2="228" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#arrht)"/>
  <text x="305" y="220" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">AOT 路径</text>
  <text x="580" y="220" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">热更路径</text>

  <!-- AOT 侧 -->
  <rect x="60" y="230" width="300" height="90" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="210" y="260" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">IL2CPP → C++ → 原生</text>
  <text x="210" y="288" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">AOT 程序集（随包）</text>
  <text x="210" y="308" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">原生执行 · 不可热更</text>

  <!-- 热更侧 -->
  <rect x="500" y="230" width="300" height="90" rx="10" fill="#fdf4ec" stroke="#d9833a" stroke-width="2"/>
  <text x="650" y="260" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#a05a20">HybridCLR 解释器</text>
  <text x="650" y="288" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">热更程序集（下载 DLL）</text>
  <text x="650" y="308" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">解释执行 · 可热更</text>

  <!-- 中间支撑 -->
  <rect x="210" y="355" width="190" height="55" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="305" y="378" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">补充元数据</text>
  <text x="305" y="398" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#555">补 IL2CPP 裁剪缺失</text>

  <rect x="460" y="355" width="190" height="55" rx="8" fill="#f4e6f7" stroke="#a35fae" stroke-width="1.5"/>
  <text x="555" y="378" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#7a3d85">跨域适配器</text>
  <text x="555" y="398" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#555">AOT ↔ 热更桥接</text>

  <!-- 底部连接 -->
  <line x1="305" y1="320" x2="305" y2="353" stroke="#8a6d1a" stroke-width="2" marker-end="url(#arrht)"/>
  <line x1="555" y1="320" x2="555" y2="353" stroke="#7a3d85" stroke-width="2" marker-end="url(#arrht)"/>

  <!-- 易混辨析 -->
  <rect x="40" y="420" width="780" height="30" rx="6" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/>
  <text x="430" y="441" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">易混：AOT vs JIT · IL vs C# · Mono vs IL2CPP · huatuo vs HybridCLR</text>
</svg>
