<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <marker id="arrhc6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">AOT ↔ 热更 双向交互</text>

  <!-- 左 AOT -->
  <rect x="40" y="70" width="350" height="300" rx="12" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="215" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">AOT 程序集</text>

  <rect x="60" y="120" width="310" height="40" rx="8" fill="#fff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="215" y="145" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#2b4a7a">接口定义 IGameEntry</text>
  <rect x="60" y="170" width="310" height="40" rx="8" fill="#fff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="215" y="195" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#2b4a7a">委托 / 事件总线</text>
  <rect x="60" y="220" width="310" height="40" rx="8" fill="#fff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="215" y="245" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#2b4a7a">反射 / 抽象基类</text>
  <text x="215" y="300" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">框架层 · 原生执行</text>

  <!-- 右热更 -->
  <rect x="470" y="70" width="350" height="300" rx="12" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="645" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">热更程序集</text>

  <rect x="490" y="120" width="310" height="40" rx="8" fill="#fff" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="645" y="145" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#3a6e31">GameEntry : IGameEntry</text>
  <rect x="490" y="170" width="310" height="40" rx="8" fill="#fff" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="645" y="195" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#3a6e31">业务逻辑 / UI</text>
  <rect x="490" y="220" width="310" height="40" rx="8" fill="#fff" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="645" y="245" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#3a6e31">订阅/发布事件</text>
  <text x="645" y="300" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">业务层 · 解释执行</text>

  <!-- 双向箭头 -->
  <line x1="390" y1="150" x2="468" y2="150" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrhc6)"/>
  <line x1="468" y1="235" x2="390" y2="235" stroke="#3a6e31" stroke-width="3.5" marker-end="url(#arrhc6)"/>
  <text x="429" y="130" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#c0392b">热更→AOT</text>
  <text x="429" y="148" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#999">直接调用</text>
  <text x="429" y="258" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#3a6e31">AOT→热更</text>
  <text x="429" y="276" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#999">接口/委托/反射</text>

  <!-- 底部 -->
  <rect x="40" y="390" width="780" height="50" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="430" y="415" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">适配器 CrossBindingAdaptor</text>
  <text x="430" y="434" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">热更对象被 AOT 以接口引用时，适配器在原生与解释器之间转发虚方法调用</text>
</svg>
