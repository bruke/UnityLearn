<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="arrhc9" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">线上问题排查与兼容性</text>

  <!-- 排查流 -->
  <rect x="40" y="70" width="240" height="60" rx="10" fill="#fdf4ec" stroke="#d9833a" stroke-width="2"/>
  <text x="160" y="98" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a05a20">热更加载失败</text>
  <line x1="280" y1="100" x2="308" y2="100" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#arrhc9)"/>

  <rect x="310" y="70" width="240" height="60" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="430" y="98" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#3a6e31">检查元数据完整性</text>
  <line x1="550" y1="100" x2="578" y2="100" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#arrhc9)"/>

  <rect x="580" y="70" width="240" height="60" rx="10" fill="#e8f8f2" stroke="#2a9d74" stroke-width="2"/>
  <text x="700" y="98" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#1d6f50">全量补元数据测试</text>

  <!-- 常见问题 -->
  <text x="430" y="180" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#333">常见问题速查</text>
  <rect x="40" y="195" width="380" height="130" rx="10" fill="#f4f8fd" stroke="#9db8dd" stroke-width="1.5"/>
  <text x="60" y="225" font-size="12" font-family="sans-serif" fill="#333">MissingMethodException → 元数据缺失 → 全量补元数据</text>
  <text x="60" y="250" font-size="12" font-family="sans-serif" fill="#333">BadImageFormatException → DLL 平台不匹配 → 重编 DLL</text>
  <text x="60" y="275" font-size="12" font-family="sans-serif" fill="#333">反射返回 null → 被 Linker 裁剪 → link.xml 保留</text>
  <text x="60" y="300" font-size="12" font-family="sans-serif" fill="#333">接口签名变了 → 与 AOT 不兼容 → 需发新版本 App</text>

  <!-- 平台 -->
  <rect x="440" y="195" width="380" height="130" rx="10" fill="#eef7ea" stroke="#bfe0b6" stroke-width="1.5"/>
  <text x="630" y="225" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#3a6e31">平台兼容</text>
  <text x="470" y="255" font-size="12" font-family="sans-serif" fill="#333">Android ✓ · iOS ✓（解释执行免 JIT）</text>
  <text x="470" y="280" font-size="12" font-family="sans-serif" fill="#333">Windows ✓ · macOS ✓ · Linux ✓</text>
  <text x="470" y="305" font-size="12" font-family="sans-serif" fill="#c0392b">WebGL / 小游戏 △ 需谨慎适配</text>

  <!-- 降级 -->
  <rect x="40" y="355" width="780" height="60" rx="10" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="430" y="380" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">容错设计</text>
  <text x="430" y="403" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">热更失败 → 用内置逻辑（不崩溃） · 服务器回滚旧版本 · 灰度发布 + 监控埋点</text>
</svg>
