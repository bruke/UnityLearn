<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="arrns" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">状态同步 vs 帧同步</text>

  <!-- 状态同步 -->
  <rect x="40" y="70" width="370" height="180" rx="12" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="225" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">状态同步</text>

  <rect x="60" y="120" width="80" height="36" rx="6" fill="#fff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="100" y="143" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#333">客户端A</text>
  <rect x="60" y="170" width="80" height="36" rx="6" fill="#fff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="100" y="193" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#333">客户端B</text>

  <rect x="200" y="145" width="90" height="36" rx="6" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="245" y="168" text-anchor="middle" font-size="11" font-family="sans-serif" font-weight="bold" fill="#a05a20">服务器</text>

  <line x1="140" y1="138" x2="198" y2="155" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrns)"/>
  <line x1="198" y1="170" x2="140" y2="180" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrns)"/>
  <line x1="140" y1="188" x2="198" y2="180" stroke="#4a6fa5" stroke-width="2" marker-end="url(#arrns)"/>

  <text x="290" y="180" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">指令 → 状态</text>
  <text x="225" y="230" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">同步状态 · 服务器权威</text>

  <!-- 帧同步 -->
  <rect x="450" y="70" width="370" height="180" rx="12" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="635" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">帧同步</text>

  <rect x="470" y="120" width="80" height="36" rx="6" fill="#fff" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="510" y="143" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#333">客户端A</text>
  <rect x="470" y="170" width="80" height="36" rx="6" fill="#fff" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="510" y="193" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#333">客户端B</text>

  <rect x="620" y="145" width="90" height="36" rx="6" fill="#e8f8f2" stroke="#2a9d74" stroke-width="2"/>
  <text x="665" y="168" text-anchor="middle" font-size="11" font-family="sans-serif" font-weight="bold" fill="#1d6f50">服务器</text>

  <line x1="550" y1="138" x2="618" y2="155" stroke="#5a9e4f" stroke-width="2" marker-end="url(#arrns)"/>
  <line x1="618" y1="155" x2="550" y2="170" stroke="#5a9e4f" stroke-width="2" marker-end="url(#arrns)"/>
  <line x1="550" y1="188" x2="618" y2="180" stroke="#5a9e4f" stroke-width="2" marker-end="url(#arrns)"/>

  <text x="635" y="230" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">只转发指令 · 客户端算</text>

  <!-- 对比表 -->
  <rect x="40" y="275" width="780" height="145" rx="10" fill="#f7f7f7" stroke="#ddd" stroke-width="1.5"/>
  <text x="430" y="305" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#333">对比</text>

  <text x="60" y="330" font-size="12" font-family="sans-serif" fill="#333">带宽：状态同步大（广播状态） vs 帧同步小（只传指令）</text>
  <text x="60" y="352" font-size="12" font-family="sans-serif" fill="#333">权威：状态同步服务器权威 vs 帧同步客户端本地算</text>
  <text x="60" y="374" font-size="12" font-family="sans-serif" fill="#333">确定性：状态同步不要求 vs 帧同步必须确定</text>
  <text x="60" y="396" font-size="12" font-family="sans-serif" fill="#333">适用：MMORPG/FPS vs MOBA/格斗/RTS</text>
</svg>
