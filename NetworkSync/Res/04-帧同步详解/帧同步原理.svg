<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <marker id="arrn4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">帧同步核心：相同输入 → 相同结果</text>

  <!-- 服务器 -->
  <rect x="330" y="60" width="200" height="60" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2.5"/>
  <text x="430" y="88" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#a05a20">服务器</text>
  <text x="430" y="108" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">广播玩家指令</text>

  <!-- 两个客户端 -->
  <rect x="40" y="200" width="240" height="120" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="160" y="230" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">客户端 A</text>
  <text x="160" y="255" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">确定性逻辑运行</text>
  <text x="160" y="280" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">指令1+2+3 → 结果 X</text>
  <text x="160" y="300" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">渲染表现</text>

  <rect x="580" y="200" width="240" height="120" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="700" y="230" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#3a6e31">客户端 B</text>
  <text x="700" y="255" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">确定性逻辑运行</text>
  <text x="700" y="280" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">指令1+2+3 → 结果 X</text>
  <text x="700" y="300" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">渲染表现</text>

  <!-- 箭头 -->
  <line x1="430" y1="120" x2="260" y2="198" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arrn4)"/>
  <line x1="430" y1="120" x2="600" y2="198" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arrn4)"/>
  <text x="300" y="160" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#c0392b">同帧指令</text>
  <text x="580" y="160" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#c0392b">同帧指令</text>

  <!-- 一致性说明 -->
  <rect x="40" y="360" width="780" height="80" rx="10" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="430" y="388" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">确定性要求</text>
  <text x="430" y="412" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">定点数代替浮点 · 固定随机种子 · 确定遍历顺序 · 不用真实时间</text>
  <text x="430" y="432" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">逻辑与表现分离 · 逻辑层确定性 · 表现层自由</text>
</svg>
