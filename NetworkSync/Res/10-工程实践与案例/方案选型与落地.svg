<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <marker id="arrn10" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">游戏类型与同步方案选型</text>

  <!-- 四类游戏 -->
  <rect x="40" y="70" width="185" height="150" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="132" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">MMORPG</text>
  <text x="132" y="130" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">状态同步</text>
  <text x="132" y="152" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">服务器权威</text>
  <text x="132" y="172" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">TCP+UDP · AOI</text>
  <text x="132" y="192" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">数万人在线</text>

  <rect x="245" y="70" width="185" height="150" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="337" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">MOBA / 格斗</text>
  <text x="337" y="130" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">帧同步</text>
  <text x="337" y="152" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">确定性逻辑</text>
  <text x="337" y="172" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">KCP · 回放</text>
  <text x="337" y="192" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">10人实时对战</text>

  <rect x="450" y="70" width="185" height="150" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="542" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#a05a20">FPS 射击</text>
  <text x="542" y="130" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">状态同步</text>
  <text x="542" y="152" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">服务器权威判定</text>
  <text x="542" y="172" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">预测+插值+延迟补偿</text>
  <text x="542" y="192" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">16~32人</text>

  <rect x="655" y="70" width="185" height="150" rx="10" fill="#f4e6f7" stroke="#a35fae" stroke-width="2"/>
  <text x="747" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#7a3d85">棋牌休闲</text>
  <text x="747" y="130" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">状态同步</text>
  <text x="747" y="152" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">TCP/WebSocket</text>
  <text x="747" y="172" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">服务器发牌</text>
  <text x="747" y="192" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">回合制</text>

  <!-- 决策 -->
  <text x="430" y="255" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#333">工程落地流程</text>
  <rect x="40" y="270" width="780" height="60" rx="10" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="430" y="298" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#8a6d1a">需求分析 → 架构设计 → 搭建框架 → 核心逻辑 → 联调优化 → 安全加固 → 上线运维</text>

  <!-- 关键技术 -->
  <rect x="40" y="350" width="380" height="90" rx="8" fill="#f7f7f7" stroke="#ddd" stroke-width="1.5"/>
  <text x="230" y="378" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#333">帧同步关键</text>
  <text x="60" y="404" font-size="11" font-family="sans-serif" fill="#333">定点数 · 固定种子 · 逻辑/表现分离</text>
  <text x="60" y="426" font-size="11" font-family="sans-serif" fill="#333">回放 · 服务器校验输入</text>

  <rect x="440" y="350" width="380" height="90" rx="8" fill="#f7f7f7" stroke="#ddd" stroke-width="1.5"/>
  <text x="630" y="378" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#333">状态同步关键</text>
  <text x="460" y="404" font-size="11" font-family="sans-serif" fill="#333">服务器权威 · AOI 广播</text>
  <text x="460" y="426" font-size="11" font-family="sans-serif" fill="#333">客户端预测+插值 · 断线重连</text>
</svg>
