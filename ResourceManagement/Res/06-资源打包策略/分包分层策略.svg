<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <marker id="arrm6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">资源分包分层策略</text>

  <!-- 四层金字塔 -->
  <polygon points="430,60 130,440 730,440" fill="#f4f8fd" stroke="#9db8dd" stroke-width="1.5"/>
  <polygon points="430,110 180,440 680,440" fill="#eef7ea" stroke="#bfe0b6" stroke-width="1.5"/>
  <polygon points="430,170 230,440 630,440" fill="#fdf4ec" stroke="#f0c8a5" stroke-width="1.5"/>
  <polygon points="430,240 280,440 580,440" fill="#f4e6f7" stroke="#e0b9e5" stroke-width="1.5"/>

  <text x="430" y="90" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">Level 1 核心层（随包）</text>
  <text x="430" y="148" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#3a6e31">Level 2 基础层（首包）</text>
  <text x="430" y="205" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a05a20">Level 3 按需层（边玩边下）</text>
  <text x="430" y="262" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#7a3d85">Level 4 DLC（可选下载）</text>

