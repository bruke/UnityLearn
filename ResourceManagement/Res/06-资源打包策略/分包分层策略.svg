  <rect x="40" y="100" width="200" height="130" rx="8" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="140" y="125" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">核心层</text>
  <text x="140" y="148" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">所有 Shader</text>
  <text x="140" y="166" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">字体</text>
  <text x="140" y="184" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">全局配置</text>

  <rect x="620" y="100" width="200" height="130" rx="8" fill="#eef7ea" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="720" y="125" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#3a6e31">基础层</text>
  <text x="720" y="148" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">通用 UI / 主城场景</text>
  <text x="720" y="166" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">玩家基础资源</text>
  <text x="720" y="184" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">BGM 音频</text>

  <rect x="40" y="250" width="200" height="130" rx="8" fill="#fdf4ec" stroke="#d9833a" stroke-width="1.5"/>
  <text x="140" y="275" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#a05a20">按需层</text>
  <text x="140" y="298" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">副本场景</text>
  <text x="140" y="316" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">时装 / NPC</text>
  <text x="140" y="334" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">音效（按地图）</text>

  <rect x="620" y="250" width="200" height="130" rx="8" fill="#f4e6f7" stroke="#a35fae" stroke-width="1.5"/>
  <text x="720" y="275" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#7a3d85">DLC</text>
