  <text x="720" y="316" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">高清纹理包</text>

  <!-- 原则 -->
  <text x="430" y="410" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#333">打包原则</text>
  <rect x="40" y="420" width="780" height="34" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="430" y="443" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#8a6d1a">独立性(按模块) · 共享性(公共抽包) · 粒度平衡(移动端 1-10MB) · 频率分离</text>
