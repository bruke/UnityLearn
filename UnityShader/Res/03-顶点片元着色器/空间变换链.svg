<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="420" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">顶点着色器空间变换链</text>

  <!-- 五阶段 -->
  <rect x="30" y="150" width="150" height="70" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="105" y="180" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">模型空间</text>
  <text x="105" y="202" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#4a6fa5">Model Space</text>

  <rect x="215" y="150" width="150" height="70" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="290" y="180" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">世界空间</text>
  <text x="290" y="202" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#5a9e4f">World Space</text>

  <rect x="400" y="150" width="150" height="70" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="475" y="180" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#a05a20">观察空间</text>
  <text x="475" y="202" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#d9833a">View Space</text>

  <rect x="585" y="150" width="150" height="70" rx="10" fill="#f4e6f7" stroke="#a35fae" stroke-width="2"/>
  <text x="660" y="180" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#7a3d85">裁剪空间</text>
  <text x="660" y="202" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#a35fae">Clip Space</text>

  <!-- 箭头 -->
  <line x1="180" y1="185" x2="213" y2="185" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr3)"/>
  <line x1="365" y1="185" x2="398" y2="185" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr3)"/>
  <line x1="550" y1="185" x2="583" y2="185" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr3)"/>

  <!-- 变换矩阵标签 -->
  <text x="197" y="135" text-anchor="middle" font-size="12" font-family="monospace" fill="#c0392b">M 矩阵</text>
  <text x="382" y="135" text-anchor="middle" font-size="12" font-family="monospace" fill="#c0392b">V 矩阵</text>
  <text x="567" y="135" text-anchor="middle" font-size="12" font-family="monospace" fill="#c0392b">P 矩阵</text>

  <!-- 屏幕映射 -->
  <rect x="585" y="270" width="150" height="70" rx="10" fill="#e8f8f2" stroke="#2a9d74" stroke-width="2"/>
  <text x="660" y="300" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#1d6f50">屏幕空间</text>
  <text x="660" y="322" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#2a9d74">Screen Space</text>

  <line x1="660" y1="220" x2="660" y2="268" stroke="#4a6fa5" stroke-width="2.5" marker-end="url(#arr3)"/>
  <text x="686" y="250" text-anchor="middle" font-size="11" font-family="monospace" fill="#c0392b">视口变换</text>

  <!-- 关键代码 -->
  <rect x="30" y="280" width="510" height="110" rx="8" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/>
  <text x="285" y="305" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#333">顶点着色器中的关键代码 (URP)</text>
  <text x="50" y="332" font-size="12" font-family="monospace" fill="#2b4a7a">VertexPositionInputs p = GetVertexPositionInputs(IN.positionOS.xyz);</text>
  <text x="50" y="354" font-size="12" font-family="monospace" fill="#2b4a7a">OUT.positionCS = p.positionCS;   // 模型 → 裁剪</text>
  <text x="50" y="376" font-size="12" font-family="monospace" fill="#2b4a7a">OUT.positionWS = p.positionWS;   // 模型 → 世界</text>

  <!-- 底部注释 -->
  <rect x="30" y="30" width="510" height="90" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="45" y="55" font-size="12" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">重要：</text>
  <text x="45" y="75" font-size="12" font-family="sans-serif" fill="#555">• 渲染必须输出裁剪空间位置 SV_POSITION</text>
  <text x="45" y="95" font-size="12" font-family="sans-serif" fill="#555">• 法线使用 (float3x3) 矩阵变换，位置用 float4x4</text>
</svg>
