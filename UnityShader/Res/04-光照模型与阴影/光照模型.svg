<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d9833a"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">经典光照模型向量关系</text>

  <!-- 光照场景示意 -->
  <text x="280" y="80" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#333">Blinn-Phong 高光向量图</text>

  <!-- 表面 -->
  <rect x="80" y="290" width="400" height="14" fill="#d9d9d9"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#888">物体表面</text>

  <!-- 法线 -->
  <line x1="280" y1="290" x2="280" y2="120" stroke="#2b4a7a" stroke-width="3" marker-end="url(#arr4)"/>
  <text x="290" y="115" font-size="13" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">N 法线</text>

  <!-- 光源方向 -->
  <line x1="470" y1="80" x2="300" y2="200" stroke="#c0392b" stroke-width="3" marker-end="url(#arr4)"/>
  <text x="440" y="75" font-size="13" font-family="sans-serif" font-weight="bold" fill="#c0392b">L 光源方向</text>

  <!-- 视线方向 -->
  <line x1="60" y1="80" x2="260" y2="200" stroke="#a35fae" stroke-width="3" marker-end="url(#arr4)"/>
  <text x="40" y="75" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a35fae">V 视线方向</text>

  <!-- 半程向量 -->
  <line x1="280" y1="290" x2="270" y2="140" stroke="#2a9d74" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="196" y="150" font-size="13" font-family="sans-serif" font-weight="bold" fill="#2a9d74">H = normalize(L+V)</text>

  <!-- 反射向量 -->
  <line x1="280" y1="290" x2="470" y2="200" stroke="#d9833a" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="500" y="205" font-size="12" font-family="sans-serif" fill="#d9833a">R (Phong)</text>

  <!-- 角度标注 -->
  <path d="M 300 200 A 24 24 0 0 0 276 216" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="305" y="218" font-size="12" font-family="sans-serif" fill="#555">θ (N·L)</text>
  <path d="M 263 160 A 18 18 0 0 1 266 142" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="246" y="120" font-size="12" font-family="sans-serif" fill="#555">θ' (N·H)</text>

  <!-- 公式卡片 -->
  <rect x="560" y="70" width="270" height="150" rx="8" fill="#eef7ea" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="695" y="100" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#3a6e31">公式对照</text>
  <text x="580" y="128" font-size="12" font-family="monospace" fill="#333">漫反射 Lambert:  color * N·L</text>
  <text x="580" y="152" font-size="12" font-family="monospace" fill="#333">半兰伯特:      color*(N·L*0.5+0.5)</text>
  <text x="580" y="176" font-size="12" font-family="monospace" fill="#333">Phong 高光:     pow(N·R, gloss)</text>
  <text x="580" y="200" font-size="12" font-family="monospace" fill="#333">Blinn-Phong:    pow(N·H, gloss)</text>

  <!-- PBR 卡片 -->
  <rect x="560" y="240" width="270" height="180" rx="8" fill="#fdf0e7" stroke="#d9833a" stroke-width="1.5"/>
  <text x="695" y="268" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#a05a20">PBR 高光 Cook-Torrance</text>
  <text x="580" y="296" font-size="12" font-family="sans-serif" fill="#555">高光 = D × G × F / (4·N·L·N·V)</text>
  <text x="580" y="320" font-size="12" font-family="sans-serif" fill="#333">D = GGX 法线分布</text>
  <text x="580" y="342" font-size="12" font-family="sans-serif" fill="#333">G = Smith 几何遮蔽</text>
  <text x="580" y="364" font-size="12" font-family="sans-serif" fill="#333">F = Schlick 菲涅尔</text>
  <text x="580" y="392" font-size="12" font-family="sans-serif" fill="#999">依赖属性: 粗糙度 Roughness</text>
  <text x="580" y="412" font-size="12" font-family="sans-serif" fill="#999">金属度 Metallic · 菲涅尔 F0</text>

  <!-- 阴影示意 -->
  <rect x="30" y="380" width="500" height="60" rx="8" fill="#eef4fd" stroke="#9db8dd" stroke-width="1.5"/>
  <text x="280" y="405" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">阴影核心</text>
  <text x="280" y="428" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">ShadowCaster Pass 渲染到 ShadowMap → 采样得 shadowAttenuation</text>
</svg>
