<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="arr6" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">屏幕后处理流程</text>

  <!-- 主流程 -->
  <rect x="40" y="100" width="190" height="70" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="135" y="130" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">场景渲染</text>
  <text x="135" y="152" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#4a6fa5">Camera → Color RT</text>

  <line x1="230" y1="135" x2="260" y2="135" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr6)"/>

  <rect x="262" y="100" width="190" height="70" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="357" y="130" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#3a6e31">后处理 Pass</text>
  <text x="357" y="152" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#5a9e4f">RenderTexture → Shader</text>

  <line x1="452" y1="135" x2="482" y2="135" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr6)"/>

  <rect x="484" y="100" width="190" height="70" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="579" y="130" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#a05a20">叠加混合</text>
  <text x="579" y="152" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#d9833a">多个效果串联</text>

  <line x1="674" y1="135" x2="704" y2="135" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr6)"/>

  <rect x="706" y="100" width="140" height="70" rx="10" fill="#e8f8f2" stroke="#2a9d74" stroke-width="2"/>
  <text x="776" y="130" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#1d6f50">屏幕输出</text>
  <text x="776" y="152" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#2a9d74">Display</text>

  <!-- 常用效果列表 -->
  <text x="430" y="220" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#333">常用后处理效果（一个 Pass 一个滤镜）</text>

  <rect x="40" y="240" width="185" height="90" rx="8" fill="#f4f8fd" stroke="#9db8dd" stroke-width="1.5"/>
  <text x="132" y="268" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">灰度 Grayscale</text>
  <text x="132" y="294" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">dot(c, (0.299,</text>
  <text x="132" y="310" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">0.587,0.114))</text>

  <rect x="245" y="240" width="185" height="90" rx="8" fill="#fdf4ec" stroke="#f0c8a5" stroke-width="1.5"/>
  <text x="337" y="268" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a05a20">高斯模糊 Blur</text>
  <text x="337" y="294" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">水平 + 垂直</text>
  <text x="337" y="310" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">两步卷积</text>

  <rect x="450" y="240" width="185" height="90" rx="8" fill="#eef7ea" stroke="#bfe0b6" stroke-width="1.5"/>
  <text x="542" y="268" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#3a6e31">泛光 Bloom</text>
  <text x="542" y="294" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">亮部提取 → 模糊</text>
  <text x="542" y="310" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">→ 叠加回原图</text>

  <rect x="655" y="240" width="185" height="90" rx="8" fill="#f4e6f7" stroke="#e0b9e5" stroke-width="1.5"/>
  <text x="747" y="268" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#7a3d85">色调映射 Tonemap</text>
  <text x="747" y="294" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">Reinhard / ACES</text>
  <text x="747" y="310" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">HDR → LDR</text>

  <!-- URP 接入 -->
  <rect x="40" y="360" width="800" height="60" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="440" y="385" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">URP 自定义接入方式</text>
  <text x="440" y="408" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">ScriptableRendererFeature.Create() → AddRenderPasses() → 在 RenderPassEvent 时机 Blit</text>
</svg>
