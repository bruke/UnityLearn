<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <marker id="arr7" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">Shader 性能优化两大关键</text>

  <!-- 左：变体爆炸 -->
  <text x="220" y="75" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#c0392b">① 变体爆炸 (Variant Explosion)</text>
  <rect x="60" y="95" width="150" height="60" rx="8" fill="#fdf4ec" stroke="#f0c8a5" stroke-width="1.5"/>
  <text x="135" y="125" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">#pragma shader_feature</text>
  <text x="135" y="145" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">_A _B _C</text>

  <line x1="135" y1="155" x2="135" y2="175" stroke="#d9833a" stroke-width="2" marker-end="url(#arr7)"/>
  <line x1="135" y1="175" x2="75" y2="175" stroke="#d9833a" stroke-width="1.5"/>
  <line x1="135" y1="175" x2="195" y2="175" stroke="#d9833a" stroke-width="1.5"/>

  <rect x="40" y="180" width="70" height="34" rx="6" fill="#e8b98a"/>
  <text x="75" y="201" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">A 开</text>
  <rect x="130" y="180" width="70" height="34" rx="6" fill="#e8b98a"/>
  <text x="165" y="201" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">B 开</text>
  <rect x="75" y="180" width="70" height="34" rx="6" fill="#e8b98a"/>
  <text x="110" y="201" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">C 开</text>

  <text x="220" y="235" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">每个开关组合 → 1 个变体</text>
  <text x="220" y="255" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">3 个关键字 → 2³ = 8 个变体</text>
  <text x="220" y="275" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">10 个关键字 → 1024 个变体 ⚠</text>

  <rect x="60" y="295" width="320" height="56" rx="8" fill="#eef7ea" stroke="#bfe0b6" stroke-width="1.5"/>
  <text x="220" y="318" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#3a6e31">对策</text>
  <text x="220" y="340" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#333">ShaderVariantCollection 预热 + Stripping 裁剪</text>

  <!-- 右：精度与采样 -->
  <text x="640" y="75" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2a9d74">② 精度与带宽</text>

  <rect x="470" y="95" width="340" height="120" rx="8" fill="#eef4fd" stroke="#9db8dd" stroke-width="1.5"/>
  <text x="640" y="120" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">精度选择</text>
  <rect x="495" y="135" width="90" height="30" rx="6" fill="#fdf4ec" stroke="#f0c8a5" stroke-width="1"/>
  <text x="540" y="155" text-anchor="middle" font-size="12" font-family="monospace" fill="#a05a20">float 32bit</text>
  <rect x="600" y="135" width="90" height="30" rx="6" fill="#eef7ea" stroke="#bfe0b6" stroke-width="1"/>
  <text x="645" y="155" text-anchor="middle" font-size="12" font-family="monospace" fill="#3a6e31">half 16bit</text>
  <rect x="705" y="135" width="90" height="30" rx="6" fill="#fffbe6" stroke="#e0c060" stroke-width="1"/>
  <text x="750" y="155" text-anchor="middle" font-size="12" font-family="monospace" fill="#8a6d1a">fixed 旧</text>
  <text x="640" y="190" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">位置/深度用 float；颜色/UV/法线用 half（移动端提速）</text>

  <rect x="470" y="235" width="340" height="116" rx="8" fill="#fdf4ec" stroke="#f0c8a5" stroke-width="1.5"/>
  <text x="640" y="260" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a05a20">采样带宽优化</text>
  <text x="490" y="285" font-size="12" font-family="sans-serif" fill="#333">• 纹理压缩 (ASTC / ETC2)</text>
  <text x="490" y="307" font-size="12" font-family="sans-serif" fill="#333">• 移动端采样次数 ≤ 4</text>
  <text x="490" y="329" font-size="12" font-family="sans-serif" fill="#333">• 多个贴图通道合并打包</text>

  <!-- 底部 -->
  <rect x="470" y="370" width="340" height="70" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="640" y="395" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">SRP Batcher 兼容</text>
  <text x="640" y="418" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">per-material 属性必须包在 CBUFFER(UnityPerMaterial)</text>

  <rect x="40" y="370" width="340" height="70" rx="8" fill="#f4e6f7" stroke="#e0b9e5" stroke-width="1.5"/>
  <text x="210" y="395" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#7a3d85">工具链</text>
  <text x="210" y="418" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">Frame Debugger / GPU Profiler / RenderDoc</text>
</svg>
