<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
  <defs>
    <marker id="arr10" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">曲面细分三阶段</text>

  <!-- 流程条 -->
  <rect x="30" y="70" width="150" height="60" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="105" y="98" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">顶点着色器</text>
  <text x="105" y="118" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#4a6fa5">Vertex</text>

  <line x1="180" y1="100" x2="210" y2="100" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr10)"/>

  <rect x="212" y="70" width="150" height="60" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="287" y="98" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#3a6e31">外壳着色器</text>
  <text x="287" y="118" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#5a9e4f">Hull</text>

  <line x1="362" y1="100" x2="392" y2="100" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr10)"/>

  <rect x="394" y="70" width="150" height="60" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="469" y="98" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#a05a20">细分器</text>
  <text x="469" y="118" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#d9833a">Tessellator(硬件)</text>

  <line x1="544" y1="100" x2="574" y2="100" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr10)"/>

  <rect x="576" y="70" width="150" height="60" rx="10" fill="#f4e6f7" stroke="#a35fae" stroke-width="2"/>
  <text x="651" y="98" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#7a3d85">域着色器</text>
  <text x="651" y="118" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#a35fae">Domain</text>

  <line x1="726" y1="100" x2="756" y2="100" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr10)"/>

  <rect x="758" y="70" width="90" height="60" rx="10" fill="#e8f8f2" stroke="#2a9d74" stroke-width="2"/>
  <text x="803" y="98" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#1d6f50">片元</text>
  <text x="803" y="118" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#2a9d74">Fragment</text>

  <!-- 三角形细分示意 -->
  <text x="280" y="200" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#333">细分效果示意</text>

  <polygon points="180,320 280,220 380,320" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">细分因子 1（原始）</text>

  <line x1="410" y1="270" x2="440" y2="270" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr10)"/>

  <polygon points="470,320 550,220 630,320" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <line x1="550" y1="220" x2="550" y2="320" stroke="#d9833a" stroke-width="1"/>
  <line x1="510" y1="270" x2="590" y2="270" stroke="#d9833a" stroke-width="1"/>
  <text x="550" y="350" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#555">细分因子 3（×9 三角形）</text>

  <!-- 说明 -->
  <rect x="30" y="160" width="200" height="60" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="130" y="185" text-anchor="middle" font-size="12" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">性能警示</text>
  <text x="130" y="207" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">细分因子 n → 三角形 × n²</text>
</svg>
