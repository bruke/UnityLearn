<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="arr11" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">Compute Shader 线程模型</text>

  <!-- Dispatch -->
  <rect x="40" y="90" width="190" height="90" rx="10" fill="#eaf1fa" stroke="#4a6fa5" stroke-width="2"/>
  <text x="135" y="118" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">Dispatch</text>
  <text x="135" y="142" text-anchor="middle" font-size="13" font-family="monospace" fill="#c0392b">Dispatch(3, 2, 1)</text>
  <text x="135" y="165" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">C# 启动，指定线程组数量</text>

  <line x1="230" y1="135" x2="270" y2="135" stroke="#4a6fa5" stroke-width="3" marker-end="url(#arr11)"/>

  <!-- 线程组网格 -->
  <rect x="272" y="70" width="340" height="140" rx="10" fill="#eef7ea" stroke="#5a9e4f" stroke-width="2"/>
  <text x="442" y="96" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">线程组网格 (3×2×1)</text>

  <!-- 绘制 3x2 组 -->
  <g fill="#f2faf0" stroke="#5a9e4f" stroke-width="1.5">
    <rect x="290" y="105" width="90" height="40"/>
    <rect x="390" y="105" width="90" height="40"/>
    <rect x="490" y="105" width="90" height="40"/>
    <rect x="290" y="152" width="90" height="40"/>
    <rect x="390" y="152" width="90" height="40"/>
    <rect x="490" y="152" width="90" height="40"/>
  </g>
  <text x="335" y="128" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#333">组[0,0]</text>
  <text x="435" y="128" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#333">组[1,0]</text>
  <text x="535" y="128" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#333">组[2,0]</text>
  <text x="335" y="175" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#333">组[0,1]</text>
  <text x="435" y="175" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#333">组[1,1]</text>
  <text x="535" y="175" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#333">组[2,1]</text>

  <!-- 放大一个组 -->
  <line x1="612" y1="105" x2="648" y2="130" stroke="#d9833a" stroke-width="2" marker-end="url(#arr11)"/>

  <rect x="650" y="90" width="190" height="120" rx="10" fill="#fdf0e7" stroke="#d9833a" stroke-width="2"/>
  <text x="745" y="116" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="bold" fill="#a05a20">线程组内部</text>
  <text x="745" y="138" text-anchor="middle" font-size="12" font-family="monospace" fill="#c0392b">[numthreads(8,8,1)]</text>

  <!-- 8x8 网格（简化 4x4 示意） -->
  <g fill="#fdf8f2" stroke="#e0a060" stroke-width="1">
    <rect x="668" y="148" width="16" height="16"/><rect x="686" y="148" width="16" height="16"/><rect x="704" y="148" width="16" height="16"/><rect x="722" y="148" width="16" height="16"/>
    <rect x="668" y="166" width="16" height="16"/><rect x="686" y="166" width="16" height="16"/><rect x="704" y="166" width="16" height="16"/><rect x="722" y="166" width="16" height="16"/>
    <rect x="668" y="184" width="16" height="16"/><rect x="686" y="184" width="16" height="16"/><rect x="704" y="184" width="16" height="16"/><rect x="722" y="184" width="16" height="16"/>
  </g>

  <!-- 变量说明 -->
  <text x="430" y="250" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#333">关键内置变量</text>
  <rect x="40" y="265" width="380" height="130" rx="8" fill="#f4f8fd" stroke="#9db8dd" stroke-width="1.5"/>
  <text x="60" y="292" font-size="13" font-family="monospace" fill="#2b4a7a">SV_DispatchThreadID</text>
  <text x="300" y="292" font-size="12" font-family="sans-serif" fill="#555">全局线程 ID</text>
  <text x="60" y="316" font-size="13" font-family="monospace" fill="#2b4a7a">SV_GroupID</text>
  <text x="300" y="316" font-size="12" font-family="sans-serif" fill="#555">线程组 ID</text>
  <text x="60" y="340" font-size="13" font-family="monospace" fill="#2b4a7a">SV_GroupThreadID</text>
  <text x="300" y="340" font-size="12" font-family="sans-serif" fill="#555">组内线程 ID</text>
  <text x="60" y="364" font-size="13" font-family="monospace" fill="#2b4a7a">SV_GroupIndex</text>
  <text x="300" y="364" font-size="12" font-family="sans-serif" fill="#555">组内线性索引</text>

  <rect x="440" y="265" width="380" height="130" rx="8" fill="#eef7ea" stroke="#bfe0b6" stroke-width="1.5"/>
  <text x="460" y="292" font-size="13" font-family="sans-serif" font-weight="bold" fill="#3a6e31">数据通信</text>
  <text x="460" y="318" font-size="12" font-family="sans-serif" fill="#333">RWStructuredBuffer ↔ C# ComputeBuffer</text>
  <text x="460" y="342" font-size="12" font-family="sans-serif" fill="#333">groupshared 组内共享内存（最快）</text>
  <text x="460" y="366" font-size="12" font-family="sans-serif" fill="#333">AsyncGPUReadback GPU→CPU 非阻塞回读</text>

  <rect x="40" y="410" width="780" height="30" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1"/>
  <text x="430" y="431" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#8a6d1a">线程组数量 = Count / numthreads，多余线程用 if (id.x &gt;= Count) return 处理</text>
</svg>
