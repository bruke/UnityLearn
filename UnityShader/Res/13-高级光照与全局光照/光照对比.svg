<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440">
  <defs>
    <marker id="arr13" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a6fa5"/></marker>
  </defs>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-family="sans-serif" font-weight="bold" fill="#333">直接光照 vs 全局光照</text>

  <!-- 左侧直接光照 -->
  <rect x="30" y="70" width="390" height="180" rx="10" fill="#f4f8fd" stroke="#9db8dd" stroke-width="2"/>
  <text x="225" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#2b4a7a">直接光照</text>

  <!-- 光源 -->
  <circle cx="90" cy="120" r="16" fill="#ffe08a" stroke="#e0b060" stroke-width="1.5"/>
  <text x="90" y="155" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#8a6d1a">太阳/灯</text>
  <line x1="104" y1="130" x2="180" y2="190" stroke="#e0b060" stroke-width="2.5" marker-end="url(#arr13)"/>

  <!-- 物体 -->
  <rect x="182" y="170" width="70" height="50" fill="#c9d9ee" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="217" y="200" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#2b4a7a">物体</text>

  <!-- 阴影 -->
  <rect x="182" y="222" width="70" height="8" fill="#a0a0a0" opacity="0.5"/>

  <text x="225" y="235" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">光线只直接照到亮面</text>

  <!-- 右侧全局光照 -->
  <rect x="440" y="70" width="390" height="180" rx="10" fill="#eef7ea" stroke="#bfe0b6" stroke-width="2"/>
  <text x="635" y="100" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#3a6e31">全局光照 (间接光照)</text>

  <circle cx="500" cy="120" r="16" fill="#ffe08a" stroke="#e0b060" stroke-width="1.5"/>
  <line x1="514" y1="130" x2="590" y2="185" stroke="#e0b060" stroke-width="2.5" marker-end="url(#arr13)"/>

  <rect x="592" y="170" width="70" height="50" fill="#bfe0b6" stroke="#5a9e4f" stroke-width="1.5"/>
  <text x="627" y="200" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#3a6e31">物体A</text>

  <!-- 反弹光 -->
  <line x1="592" y1="220" x2="720" y2="240" stroke="#5a9e4f" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr13)"/>
  <rect x="712" y="170" width="70" height="50" fill="#bcd0ea" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="747" y="200" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#2b4a7a">物体B</text>

  <text x="635" y="240" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">A 反射光 → 照亮 B 背光面</text>

  <!-- 实现方式 -->
  <text x="430" y="280" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="bold" fill="#333">间接光照的实现技术</text>

  <rect x="30" y="295" width="190" height="120" rx="8" fill="#fffbe6" stroke="#e0c060" stroke-width="1.5"/>
  <text x="125" y="322" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#8a6d1a">光照贴图烘焙</text>
  <text x="125" y="346" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">预计算存贴图</text>
  <text x="125" y="366" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">适合静态场景</text>
  <text x="125" y="386" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">成本低</text>

  <rect x="240" y="295" width="190" height="120" rx="8" fill="#fdf4ec" stroke="#f0c8a5" stroke-width="1.5"/>
  <text x="335" y="322" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#a05a20">球谐光照 SH</text>
  <text x="335" y="346" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">环境光球面近似</text>
  <text x="335" y="366" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">SampleSH(normal)</text>
  <text x="335" y="386" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">用于动态物体</text>

  <rect x="450" y="295" width="190" height="120" rx="8" fill="#f4e6f7" stroke="#e0b9e5" stroke-width="1.5"/>
  <text x="545" y="322" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#7a3d85">反射探针</text>
  <text x="545" y="346" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">Cubemap 反射</text>
  <text x="545" y="366" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">光滑物体用</text>
  <text x="545" y="386" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">实时或烘焙</text>

  <rect x="660" y="295" width="170" height="120" rx="8" fill="#e8f8f2" stroke="#2a9d74" stroke-width="1.5"/>
  <text x="745" y="322" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#1d6f50">光线追踪</text>
  <text x="745" y="346" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">真实反弹</text>
  <text x="745" y="366" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">RTX 硬件</text>
  <text x="745" y="386" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#555">高端 PC 专用</text>
</svg>
